services:
  - type: web
    name: personal-job-aggregator
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ping
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: job-aggregator-db
          property: connectionString
      - key: JOBS_SYNC_CRON
        value: "0 0 */4 * * *"

databases:
  - name: job-aggregator-db
    plan: free
    region: frankfurt
    databaseName: jobdb
    user: jobuser
