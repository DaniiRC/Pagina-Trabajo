spring:
  application:
    name: personal-job-aggregator
  profiles:
    active: dev

server:
  port: ${PORT:8080}

# Sincronización automática de ofertas (por defecto cada 4 horas: 0 0 */4 * * *)
jobs:
  sync:
    cron: "${JOBS_SYNC_CRON:0 0 */4 * * *}"
    enabled: true
    remotive:
      enabled: true
      categories:
        - "software-dev"
        - "devops-sysadmin"
    arbeitnow:
      enabled: true
    weworkremotely:
      enabled: true
      urls:
        - "https://weworkremotely.com/categories/remote-programming-jobs.rss"
        - "https://weworkremotely.com/categories/remote-devops-sysadmin-jobs.rss"
    jobicy:
      enabled: true
    tecnoempleo:
      enabled: true
      url: "${TECNOEMPLEO_RSS_URL:https://www.tecnoempleo.com/rss.xml}"
    manfred:
      enabled: true
    adzuna:
      enabled: true
    linkedin:
      enabled: true

# InfoJobs API (OAuth Basic Auth: Set INFOJOBS_CLIENT_ID and INFOJOBS_CLIENT_SECRET in Render)
infojobs:
  client:
    id: "${INFOJOBS_CLIENT_ID:}"
    secret: "${INFOJOBS_CLIENT_SECRET:}"

# Google Custom Search API for site:es.linkedin.com/jobs (Set GOOGLE_SEARCH_API_KEY and GOOGLE_SEARCH_CX in Render)
google:
  search:
    api:
      key: "${GOOGLE_SEARCH_API_KEY:}"
    cx: "${GOOGLE_SEARCH_CX:}"

# Adzuna Spain API (Free tier: Set ADZUNA_APP_ID and ADZUNA_APP_KEY in Render)
adzuna:
  app:
    id: "${ADZUNA_APP_ID:}"
    key: "${ADZUNA_APP_KEY:}"


